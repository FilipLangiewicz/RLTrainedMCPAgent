model:
  backend: transformers
  family: gemma4
  path: /kaggle/input/idm-pro-gemma-4-e2b/transformers/base/1
  thinking: false
  dtype: float16
  max_new_tokens: 1024
  temperature: 1.0
agent:
  prompt: v3
  max_steps: 25
  loop_limit: 3
  error_limit: 5
probe:
  engine: vllm
  split: test
  tasks: 16
  group: 8
  concurrency: 64
  logprob_samples: 12
  vllm:
    port: 8000
    patch: true
    tp: 1
    mem: 0.9
    max_len: 16384
    max_seqs: 64
    start_minutes: 30
    batched_tokens: 4096
